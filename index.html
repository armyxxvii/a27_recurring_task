<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>任務樹 × 循環行事曆</title>
    <link rel="icon" href="icon-192.png" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <header class="title-bar">
        <div class="controls">
            <h1>任務樹×循環行事曆<sub>v26.03.18</sub></h1>
            <div class="task-info">
                <small id="title-user"></small>
                <small id="title-month"></small>
            </div>
        </div>
        <div id="date-range" class="controls hidden">
            <input type="date" id="calendar-start" title="選擇開始日期">
            <input type="date" id="calendar-end" title="選擇結束日期">
        </div>
        <div id="date-selector" class="controls hidden">
            <input type="date" id="selected-date" title="選擇指定日期" class="enabled">
            <button type="button" id="prev-day" title="前一天">
                <i class="fas fa-angle-left"></i>
            </button>
            <button type="button" id="next-day" title="後一天">
                <i class="fas fa-angle-right"></i>
            </button>
        </div>
        <div id="controls" class="controls"></div>
    </header>
    <div class="content-area">
        <div id="task-root" class="container">
        </div>
        <div id="gantt-root" class="container">
        </div>
        <!-- 清單 -->
        <div id="list-root" class="container">
            <ul id="list-container" class="task-tree"></ul>
        </div>
        <!-- 備忘 -->
        <div id="memo-root" class="container">
            <ul id="memo-list" class="task-tree"></ul>
        </div>
    </div>

    <div id="save-toast">已儲存</div>
    <script src="script.js"></script>
</body>
</html>
